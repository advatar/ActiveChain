name: Kanalen testnet deployment

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the built bundle to the configured Mac mini"
        required: true
        default: false
        type: boolean
      deploy_host:
        description: "SSH host for the home-network validator"
        required: true
        default: "192.168.2.126"
        type: string
      status_only:
        description: "Skip the build and capture sanitized PoW deployment status"
        required: true
        default: false
        type: boolean
      expected_revision:
        description: "Exact deployed revision required by status-only mode"
        required: false
        type: string

permissions:
  contents: read

jobs:
  bundle:
    if: ${{ inputs.status_only != true }}
    runs-on: [self-hosted, macOS, ARM64, activechain-ci]
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # /usr/local/bin carries the Docker CLI symlink the RISC Zero guest build
      # shells out to. Omitting it fails the bundle at pq-zk-methods with
      # "Could not find or execute docker", which kernel.yml avoids by
      # including the same directory.
      PATH: /Users/johansellstrom/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      KANALEN_DEPLOY_USER: ${{ secrets.KANALEN_DEPLOY_USER }}
      KANALEN_DEPLOY_KEY: ${{ secrets.KANALEN_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: { clean: true, fetch-depth: 1, persist-credentials: false }
      - name: Build release bundle
        run: |
          cargo build --locked --release \
            -p activechain-consensus-runtime \
            -p activechain-rpc-server \
            -p activechain-wallet-core \
            -p activechain-wallet-ffi \
            -p activechain-verifier-ffi \
            -p activechain-work-proof-prover \
            -p activechain-work-proof-verifier
          mkdir -p dist/kanalen/{bin,lib,headers,manifests}
          cp target/release/validator-node dist/kanalen/bin/
          cp target/release/genesis-tool dist/kanalen/bin/
          cp target/release/cash-genesis-tool dist/kanalen/bin/
          cp target/release/indexer-tool dist/kanalen/bin/
          cp target/release/activechain-rpc-node dist/kanalen/bin/
          cp target/release/activechain-rpc-bootstrap dist/kanalen/bin/
          cp target/release/activechain-rpc-ingest dist/kanalen/bin/
          cp target/release/activechain-rpc-probe dist/kanalen/bin/
          cp target/release/activechain-transfer-spool dist/kanalen/bin/
          cp target/release/activechain-telemetry-anchor-gateway dist/kanalen/bin/
          cp target/release/actum-anchor-evidence dist/kanalen/bin/
          cp target/release/actum-work-proof-verifier dist/kanalen/bin/
          cp target/release/actum-work-proof-json-verifier dist/kanalen/bin/
          cp target/release/actum-work-proof-api dist/kanalen/bin/
          cp target/release/actum-work-proof-trust-bootstrap dist/kanalen/bin/
          cp target/release/actum-work-prover dist/kanalen/bin/
          cp target/release/actum-work-delivery-api dist/kanalen/bin/
          cp target/release/activechain-wallet dist/kanalen/bin/
          cp target/release/activechain-faucet dist/kanalen/bin/
          cp target/release/libactivechain_wallet_ffi.* dist/kanalen/lib/ 2>/dev/null || true
          cp crates/wallet-ffi/include/activechain_wallet.h dist/kanalen/headers/
          cp testing/vectors/activechain-verifier-package-v1.json dist/kanalen/manifests/
          cp deploy/kanalen/ports.env dist/kanalen/
          cp deploy/kanalen/network.env dist/kanalen/
          cp -R deploy/kanalen/launchagents dist/kanalen/
          cp -R deploy/kanalen/scripts dist/kanalen/
          cp -R deploy/kanalen/gateway dist/kanalen/
          cp scripts/check-validator-snapshot.sh scripts/check-execution-snapshot.sh dist/kanalen/scripts/
          tar -czf "kanalen-${GITHUB_SHA}.tar.gz" -C dist kanalen
          shasum -a 256 "kanalen-${GITHUB_SHA}.tar.gz" > "kanalen-${GITHUB_SHA}.sha256"
      - name: Publish bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kanalen-${{ github.sha }}
          path: |
            kanalen-*.tar.gz
            kanalen-*.sha256
      - name: Optional Mac mini deployment
        if: >-
          ${{ inputs.deploy == true && env.KANALEN_DEPLOY_USER != '' &&
          env.KANALEN_DEPLOY_KEY != '' }}
        env:
          DEPLOY_HOST: ${{ inputs.deploy_host }}
        run: |
          key_path=$(mktemp /tmp/activechain-kanalen-deploy-key.XXXXXX)
          trap 'rm -f "$key_path"' EXIT
          chmod 600 "$key_path"
          # OpenSSH rejects a private key whose final line is unterminated with
          # "invalid format", and secret storage does not preserve a trailing
          # newline, so restore it rather than depending on how the key was set.
          printf '%s\n' "$KANALEN_DEPLOY_KEY" > "$key_path"
          scp -i "$key_path" -o StrictHostKeyChecking=accept-new \
            "kanalen-${GITHUB_SHA}.tar.gz" "kanalen-${GITHUB_SHA}.sha256" \
            deploy/kanalen/scripts/activate-kanalen-release.sh \
            "$KANALEN_DEPLOY_USER@$DEPLOY_HOST:/Volumes/ActiveChain/testnet/"
          ssh -i "$key_path" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$KANALEN_DEPLOY_USER@$DEPLOY_HOST" \
            "bash /Volumes/ActiveChain/testnet/activate-kanalen-release.sh /Volumes/ActiveChain/testnet/kanalen-${GITHUB_SHA}.tar.gz /Volumes/ActiveChain/testnet/kanalen-${GITHUB_SHA}.sha256 ${GITHUB_SHA}"

  pow-status:
    if: ${{ inputs.status_only == true }}
    runs-on: [self-hosted, macOS, ARM64, activechain-ci]
    timeout-minutes: 5
    env:
      KANALEN_DEPLOY_USER: ${{ secrets.KANALEN_DEPLOY_USER }}
      KANALEN_DEPLOY_KEY: ${{ secrets.KANALEN_DEPLOY_KEY }}
      DEPLOY_HOST: ${{ inputs.deploy_host }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: { clean: true, fetch-depth: 1, persist-credentials: false }
      - name: Capture sanitized deployment status
        run: |
          if [[ ! "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_revision must be a full lowercase Git commit" >&2
            exit 1
          fi
          key_path=$(mktemp /tmp/activechain-kanalen-status-key.XXXXXX)
          remote_script="/tmp/activechain-kanalen-pow-status-${GITHUB_RUN_ID}.py"
          trap 'rm -f "$key_path"' EXIT
          chmod 600 "$key_path"
          printf '%s\n' "$KANALEN_DEPLOY_KEY" > "$key_path"
          scp -i "$key_path" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            scripts/capture-kanalen-pow-status.py \
            "$KANALEN_DEPLOY_USER@$DEPLOY_HOST:$remote_script"
          set +e
          ssh -i "$key_path" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$KANALEN_DEPLOY_USER@$DEPLOY_HOST" \
            "python3 '$remote_script' --expected-revision '$EXPECTED_REVISION' --output -; remote_exit=\$?; rm -f '$remote_script'; exit \$remote_exit" \
            > "pow-deployment-status-${EXPECTED_REVISION}.json"
          capture_status=$?
          set -e
          python3 -m json.tool "pow-deployment-status-${EXPECTED_REVISION}.json" >/dev/null
          printf '%s\n' "$capture_status" > pow-deployment-status.exit
      - name: Publish sanitized status artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pow-deployment-status-${{ env.EXPECTED_REVISION }}
          path: pow-deployment-status-${{ env.EXPECTED_REVISION }}.json
      - name: Enforce deployment preflight
        run: |
          test "$(cat pow-deployment-status.exit)" = 0
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          revision = os.environ["EXPECTED_REVISION"]
          evidence = json.loads(Path(f"pow-deployment-status-{revision}.json").read_text())
          assert evidence["activechain_revision"] == revision
          assert evidence["deployment_preflight_qualified"] is True
          assert evidence["production_qualified"] is False
          PY
