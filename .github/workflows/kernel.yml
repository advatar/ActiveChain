name: Deterministic kernel

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      qualification:
        description: Run affected development checks or the complete exact-SHA qualification gate
        required: true
        default: full
        type: choice
        options:
          - development
          - full

concurrency:
  group: deterministic-kernel-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PATH: /Users/johansellstrom/.elan/bin:/opt/homebrew/opt/rustup/bin:/Users/johansellstrom/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  # The runner is serial. Keeping exact-SHA artifacts outside the checkout lets clean, independent
  # jobs reuse compilation without permitting one revision to consume another revision's output.
  CARGO_TARGET_DIR: /Users/johansellstrom/.cache/activechain-ci/target/${{ github.sha }}

jobs:
  scope:
    name: Determine qualification scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      static: ${{ steps.scope.outputs.static }}
      formal: ${{ steps.scope.outputs.formal }}
      kani: ${{ steps.scope.outputs.kani }}
      tests: ${{ steps.scope.outputs.tests }}
      apple: ${{ steps.scope.outputs.apple }}
      runtime: ${{ steps.scope.outputs.runtime }}
      vectors: ${{ steps.scope.outputs.vectors }}
    steps:
      - name: Check out the exact revision and comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the exact revision
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_QUALIFICATION: ${{ inputs.qualification }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          full=false
          if [[ "$EVENT_NAME" == push ]] ||
             [[ "$EVENT_NAME" == workflow_dispatch && "$REQUESTED_QUALIFICATION" == full ]]; then
            full=true
          fi

          if [[ "$full" == true ]]; then
            changed='__FULL_QUALIFICATION__'
          elif [[ "$EVENT_NAME" == pull_request && "$PR_ACTION" == synchronize &&
                  -n "$BEFORE_SHA" && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$BEFORE_SHA...HEAD")
            else
              echo "before SHA is unreachable after force-push; classifying complete PR diff" >&2
              changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            fi
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$BEFORE_SHA...HEAD")
            else
              echo "before SHA is unreachable; classifying current commit" >&2
              changed=$(git show --pretty='' --name-only HEAD)
            fi
          else
            changed=$(git show --pretty='' --name-only HEAD)
          fi
          printf '%s\n' "$changed"

          printf '%s\n' "$changed" |
            bash scripts/classify-kernel-change-scope.sh "$full" |
            tee -a "$GITHUB_OUTPUT"

  policy:
    name: Verify qualification policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Validate the fail-closed job graph
        run: |
          python3 scripts/check-kernel-workflow-policy.py
          python3 scripts/test_check_kernel_workflow_policy.py

  static:
    name: Static kernel checks
    needs: scope
    if: needs.scope.outputs.static == 'true'
    runs-on: [self-hosted, macOS, ARM64, activechain-ci]
    timeout-minutes: 60
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: {clean: true, fetch-depth: 1, persist-credentials: false}
      - name: Install static-check prerequisites
        uses: ./.github/actions/kernel-setup
        with: {ios-targets: 'true'}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Verify canonical type-tag registry
        run: python3 scripts/check-type-tag-registry.py
      - name: Verify developer telemetry contract
        run: python3 scripts/check-developer-telemetry-contract.py
      - name: Verify independent-client complexity budget
        run: python3 scripts/check-independent-client-budget.py
      - name: Test independent Go M0 vector reader
        working-directory: tools/go-verifier
        run: go test ./...
      - name: Reproduce independent credential vectors
        run: bash scripts/generate-independent-credential-vectors.sh | diff -u testing/vectors/independent-credential-v1.tsv -
      - name: Check all targets
        env: {RISC0_SKIP_BUILD: '1'}
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check no-std kernel target
        run: >-
          cargo check --locked --target aarch64-apple-ios --lib
          -p activechain-action-kernel -p activechain-bytecode-verifier
          -p activechain-canonical-codec -p activechain-credential
          -p activechain-devnet-kernel -p activechain-protocol-types
          -p activechain-protocol-commitment -p activechain-principal
          -p activechain-capability -p activechain-cash-kernel
          -p activechain-policy-kernel -p activechain-object
          -p activechain-object-vm -p activechain-state-tree -p activechain-transition

  formal:
    name: Lean, Tamarin, Verus, and conformance
    needs: scope
    if: needs.scope.outputs.formal == 'true'
    runs-on: [self-hosted, macOS, ARM64, activechain-ci]
    timeout-minutes: 150
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: {clean: true, fetch-depth: 1, persist-credentials: false}
      - name: Install formal prerequisites
        uses: ./.github/actions/kernel-setup
        with: {lean: 'true'}
      - name: Build executable Lean reference model
        working-directory: formal/lean
        run: lake build
      - name: Prove all Lean and Tamarin models
        run: bash scripts/check-formal-models.sh
      - name: Prove consensus and economics arithmetic contracts
        run: formal/verus/verify.sh
      - name: Audit implementation traces and differential conformance
        run: bash scripts/check-proof-conformance.sh

  kani:
    name: Kani bounded-model checks
    needs: scope
    if: needs.scope.outputs.kani == 'true'
    runs-on: [self-hosted, macOS, ARM64, activechain-ci]
    timeout-minutes: 90
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: {clean: true, fetch-depth: 1, persist-credentials: false}
      - name: Install Kani prerequisites
        uses: ./.github/actions/kernel-setup
        with: {kani: 'true'}
      - name: Bounded-model-check the production canonical codec
        run: bash scripts/check-kani-codec.sh
      - name: Bounded-model-check the verifier C ABI
        run: bash scripts/check-kani-verifier-ffi.sh
      - name: Bounded-model-check the bytecode verifier and ObjectVM helpers
        run: bash scripts/check-kani-object-vm.sh
      - name: Bounded-model-check the production consensus schema and shared arithmetic
        run: bash scripts/check-kani-protocol-types.sh
      - name: Bounded-model-check commitment transcript binding
        run: bash scripts/check-kani-commitment.sh

  tests:
    name: Debug and documentation tests
    needs: scope
    if: needs.scope.outputs.tests == 'true'
    runs-on: [self-hosted, macOS, ARM64, activechain-ci]
    timeout-minutes: 90
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: {clean: true, fetch-depth: 1, persist-credentials: false}
      - name: Install test prerequisites
        uses: ./.github/actions/kernel-setup
        with: {docker: 'true'}
      - name: Run tests
        run: cargo test --locked --workspace --all-features
      - name: Run documentation tests
        run: cargo test --locked --workspace --doc
      - name: Remove isolated BuildKit worker
        if: always() && env.ACTIVECHAIN_CI_BUILDER != ''
        run: docker buildx rm "${ACTIVECHAIN_CI_BUILDER}"

  apple:
    name: Release build and Apple distribution
    needs: scope
    if: needs.scope.outputs.apple == 'true'
    runs-on: [self-hosted, macOS, ARM64, activechain-ci]
    timeout-minutes: 90
    steps:
      - name: Check out a clean exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: {clean: true, fetch-depth: 1, persist-credentials: false}
      - name: Install Apple build prerequisites
        uses: ./.github/actions/kernel-setup
        with: {ios-targets: 'true', docker: 'true'}
      - name: Build release binaries and libraries
        run: cargo build --locked --workspace --release
      - name: Assert clean source tree before packaging
        run: |
          dirty=$(git status --porcelain --untracked-files=normal)
          if [[ -n "$dirty" ]]; then
            printf 'Apple packaging source tree is dirty:\n%s\n' "$dirty" >&2
            exit 1
          fi
      - name: Reproduce and consume Apple distributions
        run: |
          cargo run --locked -p activechain-apple-distribution -- check-headers .
          dirty=$(git status --porcelain --untracked-files=normal)
          if [[ -n "$dirty" ]]; then
            printf 'header generation dirtied the Apple packaging source tree:\n%s\n' "$dirty" >&2
            exit 1
          fi
          bash scripts/check-apple-reproducibility.sh "$GITHUB_SHA"
      - name: Remove isolated BuildKit worker
        if: always() && env.ACTIVECHAIN_CI_BUILDER != ''
        run: docker buildx rm "${ACTIVECHAIN_CI_BUILDER}"

  runtime:
    name: Release tests and process rehearsals
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: [self-hosted, macOS, ARM64, activechain-ci]
    timeout-minutes: 120
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: {clean: true, fetch-depth: 1, persist-credentials: false}
      - name: Install runtime prerequisites
        uses: ./.github/actions/kernel-setup
        with: {docker: 'true'}
      - name: Run release tests
        run: cargo test --locked --workspace --release
      - name: Qualify pow.actum.network deterministic integration
        run: >-
          python3 scripts/qualify-pow-e2e.py
          --revision "$GITHUB_SHA"
          --output "pow-e2e-deterministic-${GITHUB_SHA}.json"
      - name: Publish pow.actum.network deterministic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pow-e2e-deterministic-${{ github.sha }}
          path: pow-e2e-deterministic-${{ github.sha }}.json
      - name: Rehearse validator processes
        run: bash scripts/rehearse-validator-processes.sh
      - name: Rehearse live process quorum
        run: bash scripts/rehearse-live-process-quorum.sh
      - name: Rehearse consensus view change
        run: bash scripts/rehearse-consensus-view-change.sh
      - name: Rehearse validator key rotation
        run: bash scripts/rehearse-validator-key-rotation.sh
      - name: Verify fail-closed Kanalen cash publication
        run: bash scripts/test-kanalen-round-cash-gate.sh
      - name: Qualify Kanalen deployment locally
        run: bash scripts/test-qualify-kanalen-local.sh
      - name: Verify public Kanalen RPC status fixture
        run: python3 scripts/test_probe_kanalen_rpc.py
      - name: Remove isolated BuildKit worker
        if: always() && env.ACTIVECHAIN_CI_BUILDER != ''
        run: docker buildx rm "${ACTIVECHAIN_CI_BUILDER}"

  vectors:
    name: Canonical vectors and semantic tables
    needs: scope
    if: needs.scope.outputs.vectors == 'true'
    runs-on: [self-hosted, macOS, ARM64, activechain-ci]
    timeout-minutes: 60
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: {clean: true, fetch-depth: 1, persist-credentials: false}
      - name: Install vector prerequisites
        uses: ./.github/actions/kernel-setup
        with: {lean: 'true'}
      - name: Reproduce canonical vectors
        run: |
          cargo run --locked --quiet -p activechain-vector-generator -- principal-v1 | diff -u testing/vectors/canonical/principal-v1.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- authority-v1 | diff -u testing/vectors/authority/authority-v1.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- credential-v1 | diff -u testing/vectors/credential/credential-v1.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- apl-v1 | diff -u testing/vectors/policy/apl-v1.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- object-transition-v1 | diff -u testing/vectors/object/object-transition-v1.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- state-tree-v1 | diff -u testing/vectors/state/state-tree-v1.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- object-vm-v1 | diff -u testing/vectors/vm/object-vm-v1.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- devnet-block-v1 | diff -u testing/vectors/devnet/devnet-block-v1.txt -
          cargo run --locked --quiet -p activechain-semantic-devnet -- empty-block | diff -u testing/vectors/devnet/empty-block.txt -
          cargo run --locked --quiet -p activechain-application-primitives --example anchor_vector | diff -u testing/vectors/application/external-anchor-v1.txt -
          cargo run --locked --quiet -p activechain-application-primitives --example telemetry_anchor_vector | diff -u testing/vectors/application/telemetry-anchor-v1.txt -
          cargo run --locked --quiet -p activechain-work-proof --example work_claim_vector | diff -u testing/vectors/application/work-claim-v1.txt -
      - name: Cross-check Rust and Lean semantic tables
        run: |
          cargo run --locked --quiet -p activechain-vector-generator -- apl-truth-table | diff -u testing/vectors/policy/apl-truth-table.txt -
          (cd formal/lean && lake exe aplTruthTable) | diff -u testing/vectors/policy/apl-truth-table.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- credential-status-table | diff -u testing/vectors/credential/credential-status-table.txt -
          (cd formal/lean && lake exe credentialStatusTable) | diff -u testing/vectors/credential/credential-status-table.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- object-model-table | diff -u testing/vectors/object/object-model-table.txt -
          (cd formal/lean && lake exe objectTable) | diff -u testing/vectors/object/object-model-table.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- state-tree-model-table | diff -u testing/vectors/state/state-tree-model-table.txt -
          (cd formal/lean && lake exe stateTreeTable) | diff -u testing/vectors/state/state-tree-model-table.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- object-vm-model-table | diff -u testing/vectors/vm/object-vm-model-table.txt -
          (cd formal/lean && lake exe objectVMTable) | diff -u testing/vectors/vm/object-vm-model-table.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- nonce-model-table | diff -u testing/vectors/devnet/nonce-model-table.txt -
          (cd formal/lean && lake exe nonceTable) | diff -u testing/vectors/devnet/nonce-model-table.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- epoch-upgrade-model-table | diff -u testing/vectors/consensus/epoch-upgrade-model-table.txt -
          (cd formal/lean && lake exe epochUpgradeTable) | diff -u testing/vectors/consensus/epoch-upgrade-model-table.txt -
          (cd formal/lean && lake exe didLifecycleTable) | diff -u testing/vectors/did-lifecycle-model-table.txt -
          cargo run --locked --quiet -p activechain-vector-generator -- codec-length-table | diff -u testing/vectors/canonical/length-prefix-table.txt -
          (cd formal/lean && lake exe codecLengthTable) | diff -u testing/vectors/canonical/length-prefix-table.txt -

  qualification:
    name: Deterministic kernel qualification
    needs: [scope, policy, static, formal, kani, tests, apple, runtime, vectors]
    if: always() && needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require every exact-SHA qualification stage
        env:
          STAGE_RESULTS: ${{ toJSON(needs) }}
          QUALIFIED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["STAGE_RESULTS"])
          required = ("policy", "static", "formal", "kani", "tests", "apple", "runtime", "vectors")
          rejected = {name: results.get(name, {}).get("result") for name in required
                      if results.get(name, {}).get("result") != "success"}
          if rejected:
              raise SystemExit(f"exact-SHA qualification incomplete: {rejected}")
          print(f"complete deterministic-kernel qualification passed for {os.environ['QUALIFIED_SHA']}")
          PY

  development:
    name: Deterministic kernel development checks
    needs: [scope, policy, static, formal, kani, tests, apple, runtime, vectors]
    if: always() && needs.scope.outputs.full != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected development stage
        env:
          STAGE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["STAGE_RESULTS"])
          rejected = {name: value.get("result") for name, value in results.items()
                      if name != "scope" and value.get("result") not in ("success", "skipped")}
          if results.get("policy", {}).get("result") != "success" or rejected:
              raise SystemExit(f"development checks incomplete: {rejected}")
          print("all selected deterministic-kernel development checks passed")
          PY
