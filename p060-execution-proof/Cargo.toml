[package]
name = "p060-execution-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Gate-1 reference implementation for P-060 execution validity receipts"

# This reference package is intentionally standalone until its ObjectVM AIR is
# promoted into the protocol workspace. Keep Cargo from implicitly attaching it
# to the parent workspace while it is evaluated independently.
[workspace]

[lib]
name = "p060"
path = "src/lib.rs"

[[bin]]
name = "p060"
path = "src/main.rs"

[dependencies]
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "=0.10.8"
thiserror = "2.0"
winterfell = "=0.13.1"
winter-utils = "=0.13.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
