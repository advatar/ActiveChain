tcp:
  routers:
    activechain-rpc:
      entryPoints:
        - websecure
      rule: HostSNI(`rpc.kanalen.activechain.dev`)
      priority: 100
      service: activechain-rpc
      tls:
        certResolver: letsencrypt

    activechain-anchor:
      entryPoints:
        - websecure
      rule: HostSNI(`anchor.kanalen.activechain.dev`)
      priority: 100
      service: activechain-anchor
      tls:
        certResolver: letsencrypt

    activechain-work-proof:
      entryPoints:
        - websecure
      rule: HostSNI(`verify.kanalen.activechain.dev`)
      priority: 100
      service: activechain-work-proof
      tls:
        certResolver: letsencrypt

    existing-https:
      entryPoints:
        - websecure
      rule: HostSNI(`*`)
      priority: 1
      service: existing-caddy
      tls:
        passthrough: true

  services:
    activechain-rpc:
      loadBalancer:
        servers:
          - address: host.docker.internal:49151

    activechain-anchor:
      loadBalancer:
        servers:
          - address: host.docker.internal:49156

    activechain-work-proof:
      loadBalancer:
        servers:
          - address: host.docker.internal:49157

    existing-caddy:
      loadBalancer:
        servers:
          - address: providehr-caddy:443

tls:
  options:
    # TCP termination forwards the negotiated protocol directly to the HTTP/1.1
    # application servers. Keep this as the default so Traefik's internal ACME
    # TLS-ALPN router and every terminating application router use one policy.
    default:
      alpnProtocols:
        - http/1.1
        - acme-tls/1
