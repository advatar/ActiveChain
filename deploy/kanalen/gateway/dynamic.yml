tcp:
  routers:
    activechain-rpc:
      entryPoints:
        - websecure
      rule: HostSNI(`rpc.kanalen.activechain.dev`)
      priority: 100
      service: activechain-rpc
      tls:
        certResolver: letsencrypt

    activechain-anchor:
      entryPoints:
        - websecure
      rule: HostSNI(`anchor.kanalen.activechain.dev`)
      priority: 100
      service: activechain-anchor
      tls:
        certResolver: letsencrypt
        options: actum-http1

    activechain-work-proof:
      entryPoints:
        - websecure
      rule: HostSNI(`verify.kanalen.activechain.dev`)
      priority: 100
      service: activechain-work-proof
      tls:
        certResolver: letsencrypt
        options: actum-http1

    activechain-work-delivery:
      entryPoints:
        - websecure
      rule: HostSNI(`delivery.kanalen.actum.network`)
      priority: 101
      service: activechain-work-delivery
      tls:
        certResolver: letsencrypt
        options: actum-http1

    activechain-work-delivery-legacy:
      entryPoints:
        - websecure
      rule: HostSNI(`delivery.kanalen.activechain.dev`)
      priority: 100
      service: activechain-work-delivery
      tls:
        certResolver: letsencrypt
        options: actum-http1

    existing-https:
      entryPoints:
        - websecure
      rule: HostSNI(`*`)
      priority: 1
      service: existing-caddy
      tls:
        passthrough: true

  services:
    activechain-rpc:
      loadBalancer:
        servers:
          - address: host.docker.internal:49151

    activechain-anchor:
      loadBalancer:
        servers:
          - address: host.docker.internal:49156

    activechain-work-proof:
      loadBalancer:
        servers:
          - address: host.docker.internal:49157

    activechain-work-delivery:
      loadBalancer:
        servers:
          - address: host.docker.internal:49158

    existing-caddy:
      loadBalancer:
        servers:
          - address: providehr-caddy:443

tls:
  options:
    # TCP termination forwards the negotiated protocol directly to these
    # HTTP/1.1 application servers. Keep ACME on Traefik's untouched built-in
    # default, which includes its private acme-tls/1 challenge handling.
    actum-http1:
      alpnProtocols:
        - http/1.1
