apiVersion: v1
kind: Secret
metadata:
  name: activechain-demo-token
  labels: {app.kubernetes.io/part-of: cognitive-health-demo}
type: Opaque
stringData:
  token: cognitive-health-demo-token-0001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activechain-demo-gateway
  labels: {app.kubernetes.io/name: activechain-demo-gateway, app.kubernetes.io/part-of: cognitive-health-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: activechain-demo-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: activechain-demo-gateway, app.kubernetes.io/part-of: cognitive-health-demo}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: cognitive-health-demo/activechain-gateway:dev
          imagePullPolicy: IfNotPresent
          args: ["0.0.0.0:8797", "activechain-rpc:49152"]
          env:
            - {name: ACTUM_DEMO_BEARER_TOKEN_FILE, value: "/var/run/secrets/activechain/token"}
          ports: [{name: http, containerPort: 8797}]
          readinessProbe: {httpGet: {path: /v1/health, port: http}, periodSeconds: 3}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          volumeMounts:
            - {name: token, mountPath: /var/run/secrets/activechain, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: "1", memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
      volumes:
        - name: token
          secret:
            secretName: activechain-demo-token
            defaultMode: 0400
      nodeSelector: {kubernetes.io/arch: arm64}
---
apiVersion: v1
kind: Service
metadata:
  name: activechain-demo-gateway
spec:
  selector: {app.kubernetes.io/name: activechain-demo-gateway}
  ports: [{name: http, port: 8797, targetPort: http}]
