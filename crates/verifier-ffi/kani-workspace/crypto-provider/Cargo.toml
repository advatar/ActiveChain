# Verification-only metadata shim. The library target is the production crypto-provider source.
[package]
name = "activechain-crypto-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
default = ["protected-envelopes"]
protected-envelopes = ["dep:ml-kem", "dep:ring", "dep:zeroize"]

[lib]
path = "../../../crypto-provider/src/lib.rs"

[dependencies]
activechain-consensus-verifier.workspace = true
activechain-protocol-types.workspace = true
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"] }
ml-kem = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
slh-dsa.workspace = true
sha3.workspace = true
zeroize = { workspace = true, optional = true }
