# Verification-only metadata shim. The library target is the production wallet-core source.
[package]
name = "activechain-wallet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
default = ["passphrase-keystore"]
passphrase-keystore = [
    "activechain-crypto-provider/protected-envelopes",
    "dep:getrandom",
    "dep:ring",
]

[lib]
path = "../../../wallet-core/src/lib.rs"

[dependencies]
activechain-canonical-codec.workspace = true
activechain-cash-kernel.workspace = true
activechain-crypto-provider = { path = "../crypto-provider", version = "0.1.0", default-features = false }
activechain-principal.workspace = true
activechain-protocol-commitment.workspace = true
activechain-protocol-types.workspace = true
getrandom = { workspace = true, optional = true }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"] }
ring = { workspace = true, optional = true }
sha3.workspace = true
zeroize.workspace = true
