[package]
name = "activechain-application-primitives"
version.workspace = true
edition.workspace = true
rust-version = "1.94.1"
repository.workspace = true

[features]
default = ["std", "checkpoint-state-proof"]
checkpoint-state-proof = ["dep:activechain-state-tree"]
std = []

[dependencies]
activechain-accumulator.workspace = true
activechain-canonical-codec.workspace = true
activechain-cash-kernel.workspace = true
activechain-crypto-provider.workspace = true
activechain-protocol-commitment.workspace = true
activechain-protocol-types.workspace = true
activechain-privacy-kernel.workspace = true
activechain-rpc-types.workspace = true
activechain-state-tree = { workspace = true, optional = true }
sha2.workspace = true
sha3.workspace = true

[dev-dependencies]
tempfile = "3.20.0"
ml-dsa = "0.1.1"

[lints]
workspace = true
