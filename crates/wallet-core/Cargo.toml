[package]
name = "activechain-wallet-core"
description = "OpenWallet-aligned ActiveChain wallet primitives for PQ identity and Coin Cell intents"
version.workspace = true
edition.workspace = true
rust-version = "1.94.1"
repository.workspace = true
publish = false

[features]
default = ["passphrase-keystore"]
passphrase-keystore = [
    "activechain-crypto-provider/protected-envelopes",
    "dep:getrandom",
    "dep:ring",
]

[dependencies]
activechain-canonical-codec.workspace = true
activechain-cash-kernel.workspace = true
activechain-crypto-provider = { workspace = true, default-features = false }
activechain-principal.workspace = true
activechain-protocol-types.workspace = true
activechain-protocol-commitment.workspace = true
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
sha3.workspace = true
getrandom = { version = "0.3", optional = true }
zeroize = "1.8"
ring = { version = "0.17.14", optional = true }

[lints]
workspace = true

[dev-dependencies]
activechain-accumulator.workspace = true
