[package]
name = "activechain-pq-zk-guest"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "abort"
strip = "symbols"

[dependencies]
activechain-canonical-codec = { path = "../../canonical-codec" }
activechain-cash-air = { path = "../../cash-air" }
activechain-private-billboard = { path = "../../private-billboard", default-features = false }
activechain-privacy-kernel = { path = "../../privacy-kernel" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
sha3 = { version = "0.10.8", default-features = false }

[[bin]]
name = "activechain-pq-zk-guest"
path = "src/main.rs"

[[bin]]
name = "billboard-post"
path = "src/bin/billboard_post.rs"

[[bin]]
name = "billboard-withdraw"
path = "src/bin/billboard_withdraw.rs"

[[bin]]
name = "proof-of-funds"
path = "src/bin/proof_of_funds.rs"

[[bin]]
name = "private-identity"
path = "src/bin/private_identity.rs"

[[bin]]
name = "cash-recursive-leaf"
path = "src/bin/cash_recursive_leaf.rs"

[[bin]]
name = "cash-recursive-microbatch"
path = "src/bin/cash_recursive_microbatch.rs"

[[bin]]
name = "cash-recursive-partition"
path = "src/bin/cash_recursive_partition.rs"

[[bin]]
name = "cash-recursive-slot"
path = "src/bin/cash_recursive_slot.rs"

[[bin]]
name = "cash-recursive-global"
path = "src/bin/cash_recursive_global.rs"
