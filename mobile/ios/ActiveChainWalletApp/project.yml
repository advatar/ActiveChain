name: ActiveChainWallet
options:
  bundleIdPrefix: dev.activechain
  deploymentTarget:
    iOS: "17.0"
packages:
  AnyIdentity:
    path: ../../../vendor/AnyIdentity
targets:
  ActiveChainWallet:
    type: application
    info:
      path: Config/WalletInfo.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: dev.activechain.wallet.identity
            CFBundleURLSchemes: [activechain-wallet]
    platform: iOS
    sources:
      - path: Sources
      - path: ../ActiveChainWallet/Sources/ActiveChainWallet
      - path: Resources
        buildPhase: resources
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: L2AF8KFX35
      PRODUCT_BUNDLE_IDENTIFIER: dev.activechain.wallet
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 1
      PRODUCT_MODULE_NAME: ActiveChainWalletApp
      SWIFT_VERSION: "5.9"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: ActiveChain Wallet
      INFOPLIST_KEY_CFBundleIconName: AppIcon
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: AnyIdentity
        product: AnyIdentity
      - framework: ../../../dist/apple/current/ActiveChainWallet.xcframework
        embed: false
    scheme:
      testTargets:
        - ActiveChainWalletTests
  ActiveChainWalletMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: ../ActiveChainWallet/Sources/ActiveChainWallet
    settings:
      CODE_SIGN_ENTITLEMENTS: Config/ActiveChainWalletMac.entitlements
      DEVELOPMENT_TEAM: L2AF8KFX35
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: ActiveChain Wallet
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
      PRODUCT_BUNDLE_IDENTIFIER: dev.activechain.wallet.macos
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 1
      PRODUCT_MODULE_NAME: ActiveChainWalletApp
      SWIFT_VERSION: "5.9"
    dependencies:
      - package: AnyIdentity
        product: AnyIdentity
      - framework: ../../../dist/apple/current/ActiveChainWallet.xcframework
        embed: false
    scheme:
      testTargets:
        - ActiveChainWalletMacTests
        - ActiveChainWalletMacUITests
  ActiveChainWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ActiveChainWallet
      - package: AnyIdentity
        product: AnyIdentity
    settings:
      GENERATE_INFOPLIST_FILE: YES
  ActiveChainWalletMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_MODULE_NAME: ActiveChainWalletMacTests
      SWIFT_VERSION: "5.9"
    dependencies:
      - target: ActiveChainWalletMac
      - package: AnyIdentity
        product: AnyIdentity
  ActiveChainWalletIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IOSUITests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.9"
      TEST_TARGET_NAME: ActiveChainWallet
    dependencies:
      - target: ActiveChainWallet
  ActiveChainWalletIdentityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IdentityUITests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.9"
      TEST_TARGET_NAME: ActiveChainWallet
    dependencies:
      - target: ActiveChainWallet
  ActiveChainWalletMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: UITests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_MODULE_NAME: ActiveChainWalletMacUITests
      SWIFT_VERSION: "5.9"
      TEST_TARGET_NAME: ActiveChainWalletMac
    dependencies:
      - target: ActiveChainWalletMac
schemes:
  ActiveChainWalletLiveE2E:
    build:
      targets:
        ActiveChainWallet: all
    test:
      gatherCoverageData: false
      targets:
        - ActiveChainWalletIOSUITests

  ActiveChainWalletIdentityE2E:
    build:
      targets:
        ActiveChainWallet: all
    test:
      gatherCoverageData: false
      targets:
        - ActiveChainWalletIdentityUITests
