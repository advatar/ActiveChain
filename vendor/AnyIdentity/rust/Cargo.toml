[package]
name = "anyidentity-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "anyidentity_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
